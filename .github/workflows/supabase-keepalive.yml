# Supabase free-tier projects pause after ~7 days without activity. SwingIQ only
# uses Supabase for auth, so it goes quiet whenever nobody logs in. This job
# reads one row from auth.users daily so the project always registers activity.
# A failed run (e.g. project already paused) triggers GitHub's failure email.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 14 * * *" # daily, 14:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase auth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repo secrets are required"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "${SUPABASE_URL%/}/auth/v1/admin/users?page=1&per_page=1")
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase keep-alive failed (HTTP $status) — project may be paused"
            exit 1
          fi
